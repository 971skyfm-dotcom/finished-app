name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
      - 'apk-distribution/app-debug.apk.sha256'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Debug APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK artifact and checksum
        id: validate
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is missing or empty." >&2
            exit 1
          fi
          if [ ! -f "$SHA_PATH" ]; then
            echo "Error: $SHA_PATH not found." >&2
            exit 1
          fi

          (cd apk-distribution && sha256sum -c "app-debug.apk.sha256")
          unzip -tq "$APK_PATH"

          APK_SIZE_BYTES=$(wc -c < "$APK_PATH" | tr -d ' ')
          APK_SIZE_HUMAN=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(awk '{print $1}' "$SHA_PATH")

          echo "size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build ${{ github.run_number }}.${{ github.run_attempt }}"
          NOTES=$(printf "Automated debug APK release.\n\n- **Asset**: \`app-debug.apk\`\n- **Size**: %s (%s bytes)\n- **SHA-256**: \`%s\`\n" \
            "${{ steps.validate.outputs.size_human }}" \
            "${{ steps.validate.outputs.size_bytes }}" \
            "${{ steps.validate.outputs.sha256 }}")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "apk-distribution/app-debug.apk#app-debug.apk" \
              --clobber
          else
            gh release create "$TAG" \
              "apk-distribution/app-debug.apk#app-debug.apk" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "## Debug APK Release Published"
            echo ""
            echo "- **Release Tag**: \`${{ steps.release.outputs.tag }}\`"
            echo "- **APK Size**: ${{ steps.validate.outputs.size_human }} (${{ steps.validate.outputs.size_bytes }} bytes)"
            echo "- **SHA-256**: \`${{ steps.validate.outputs.sha256 }}\`"
            echo "- **GitHub Release Page**: ${{ steps.release.outputs.release_url }}"
            echo "- **Direct Latest Download URL**: ${{ steps.release.outputs.direct_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
